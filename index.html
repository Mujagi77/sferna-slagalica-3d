<html lang="sr">

<meta charset="UTF-8">

<title>Sferna Slagalica Brojeva 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
:root{color-scheme:dark;--ac:#38bdf8;--bg:#020617;--glass:rgba(15,23,42,.7);--bd:rgba(255,255,255,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:radial-gradient(circle at 50% 40%,#0b1330,#020617 70%,#000);color:#f8fafc;font-family:Inter,system-ui,-apple-system,sans-serif;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;touch-action:none}
#cv canvas{display:block}
.ui{position:fixed;left:0;right:0;pointer-events:none;display:flex;justify-content:center;padding:0 10px}
#top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 10px)}
#bot{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
.bar{pointer-events:auto;display:flex;gap:8px;align-items:center;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:18px;padding:8px 10px;max-width:100%}
.stat{display:flex;flex-direction:column;align-items:center;min-width:44px;padding:0 6px}
.stat small{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#94a3b8;font-weight:700}
.stat b{font-size:16px;font-weight:900;color:var(--ac)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{background:rgba(255,255,255,.07);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:52px;transition:transform .1s,background .2s}
.btn span{font-size:18px;line-height:1}
.btn:active{transform:scale(.92)}
.btn:hover{background:rgba(255,255,255,.14)}
.pri{background:linear-gradient(135deg,#0ea5e9,#6366f1);border:0}
#lvbtn{flex-direction:row;gap:6px;font-size:13px;padding:8px 12px}
#prog{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 74px);width:min(340px,70vw);height:5px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;pointer-events:none}
#prog i{display:block;height:100%;width:0;background:var(--ac);box-shadow:0 0 10px var(--ac);transition:width .3s}
.modal{position:fixed;inset:0;background:rgba(2,6,23,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.on{display:flex}
.card{background:var(--glass);border:1px solid var(--bd);border-radius:24px;padding:22px;width:min(420px,100%);max-height:90vh;overflow:auto;text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.card h2{margin:0 0 4px;font-size:26px;font-weight:900;background:linear-gradient(90deg,#34d399,var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}
.card p{color:#cbd5e1;font-size:14px;margin:6px 0 14px}
.lvs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.lv{background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:left}
.lv b{display:block;font-size:14px}.lv small{color:#94a3b8;font-size:11px}.lv .st{display:block;font-size:13px;margin-top:3px;letter-spacing:2px}
.lv.cur{border-color:var(--ac);box-shadow:0 0 12px -2px var(--ac)}
.lv.lock{opacity:.4;cursor:not-allowed}
.big{font-size:44px;letter-spacing:6px;margin:4px 0}
.row{display:flex;gap:8px}.row .btn{flex:1;flex-direction:row;justify-content:center;font-size:14px;padding:12px}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px;font-weight:900;pointer-events:none;opacity:0;text-shadow:0 0 20px var(--ac)}
#toast.on{animation:tst 1.1s ease-out}
@keyframes tst{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-90%)}}
@media(max-width:480px){.stat b{font-size:14px}.btn{min-width:46px;padding:7px 6px;font-size:11px}#rec{display:none}}
</style>
</head>
<body>
<div id="cv"></div>
<div class="ui" id="top"><div class="bar">
  <button class="btn" id="lvbtn"><span>☰</span><b id="lvname">Nivo 1</b></button>
  <div class="stat"><small>Potezi</small><b id="mv">0</b></div>
  <div class="stat"><small>Vreme</small><b id="tm">00:00</b></div>
  <div class="stat" id="rec"><small>Rekord</small><b id="bs">--</b></div>
  <button class="btn" id="thbtn" title="Tema"><span>🎨</span></button>
  <button class="btn" id="sdbtn" title="Zvuk"><span id="sdi">🔊</span></button>
</div></div>
<div id="prog"><i id="pb"></i></div>
<div id="toast"></div>
<div class="ui" id="bot"><div class="bar">
  <button class="btn" id="bUndo"><span>↶</span>Nazad</button>
  <button class="btn" id="bHint"><span>💡</span>Savet</button>
  <button class="btn pri" id="bShuf"><span>🔀</span>Mešaj</button>
  <button class="btn" id="bSolve"><span>🪄</span>Reši</button>
  <button class="btn" id="bCam"><span>🎥</span>Kamera</button>
</div></div>

<div class="modal" id="menu"><div class="card">
  <h1 style="font-size: 22px; font-weight: 900; margin: 0 0 2px; color: var(--ac); letter-spacing: 1px;">SFERNA SLAGALICA BROJEVA 3D</h1>
  <p style="font-size: 12px; opacity: 0.75; margin: 0 0 16px; letter-spacing: 1px;">— Složi pločice na sferi —</p>
  
  <h2>Izaberi nivo</h2>
  <p>Svaka slagalica je uvek rešiva. Prevlači sferu da je okreneš, tapni pločicu pored praznog polja.</p>
  <div class="lvs" id="lvs"></div>
  <button class="btn pri" style="width:100%;flex-direction:row;justify-content:center;font-size:14px;padding:12px" id="mclose">Nastavi</button>
</div></div>
<div class="modal" id="win"><div class="card">
  <div class="big" id="wst">⭐⭐⭐</div>
  <h2 id="wt">BRAVO!</h2><p id="wm"></p>
  <div class="row"><button class="btn" id="wAgain">↻ Ponovo</button><button class="btn pri" id="wNext">Sledeći ▶</button></div>
</div></div>

<script>
const $=id=>document.getElementById(id);

let store={u:1,s:{},b:{},t:0,l:0};
try{Object.assign(store,JSON.parse(localStorage.getItem('orb3')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('orb3',JSON.stringify(store))}catch(e){}};

const LV=[{r:3,c:3,s:14},{r:3,c:4,s:22},{r:4,c:4,s:36},{r:4,c:5,s:50},{r:4,c:6,s:64},{r:5,c:5,s:80},{r:5,c:6,s:100},{r:6,c:6,s:130}];
const TH=[{n:'Neon',h:[190,265]},{n:'Smaragd',h:[160,80]},{n:'Zlato',h:[50,8]},{n:'Magma',h:[355,45]},{n:'Purpur',h:[285,335]}];
const RAD=2.4,CAP=.22;

let AC,snd=true;
function tone(f,d,type='sine',v=.15,t0=0,f2){if(!snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sfx={move:()=>tone(520,.12,'sine',.15,0,300),good:()=>{tone(660,.14,'triangle',.15);tone(990,.2,'triangle',.12,.07)},shuf:()=>[0,1,2,3,4].forEach(i=>tone(260+i*70,.09,'triangle',.1,i*.05)),win:()=>[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.45,'triangle',.15,i*.1)),ui:()=>tone(700,.06,'square',.05),hint:()=>tone(880,.18,'sine',.1)};
const buzz=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};

let lv=Math.min(store.l||0,LV.length-1),L,R,C,N,tp,tl,th=store.t||0;
let grid=[],tiles=[],path=[],hist=[],moves=0,secs=0,started=false,locked=false,assisted=false,hintTile=null,hintUntil=0,autoTimer=null,introT=0;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
$('cv').appendChild(renderer.domElement);
const cvEl=renderer.domElement;
const controls=new THREE.OrbitControls(camera,cvEl);
controls.enableDamping=true;controls.dampingFactor=.06;controls.enablePan=false;controls.autoRotate=true;controls.autoRotateSpeed=.7;
let rotTO;controls.addEventListener('start',()=>{controls.autoRotate=false;clearTimeout(rotTO)});
controls.addEventListener('end',()=>{rotTO=setTimeout(()=>controls.autoRotate=true,4000)});
scene.add(new THREE.AmbientLight(0xffffff,.85));
const l1=new THREE.DirectionalLight(0xffffff,1.5);l1.position.set(5,6,6);scene.add(l1);
const l2=new THREE.DirectionalLight(0x6366f1,1.1);l2.position.set(-6,-4,-5);scene.add(l2);
scene.add(new THREE.Mesh(new THREE.SphereGeometry(RAD-.05,48,48),new THREE.MeshStandardMaterial({color:0x040a1c,roughness:.3,metalness:.9})));
const sg=new THREE.Group();scene.add(sg);
const capMat=new THREE.MeshStandardMaterial({color:0x111827,emissive:0x38bdf8,emissiveIntensity:.5,roughness:.3,metalness:.5});
sg.add(new THREE.Mesh(new THREE.SphereGeometry(RAD,32,4,0,Math.PI*2,0,CAP-.01),capMat));
sg.add(new THREE.Mesh(new THREE.SphereGeometry(RAD,32,4,0,Math.PI*2,Math.PI-CAP+.01,CAP-.01),capMat));
const tileGroup=new THREE.Group();sg.add(tileGroup);
const emptyMat=new THREE.MeshBasicMaterial({color:0x38bdf8,transparent:true,opacity:.15,side:THREE.DoubleSide,depthWrite:false});
const emptyM=new THREE.Mesh(new THREE.BufferGeometry(),emptyMat);sg.add(emptyM);

{const n=700,p=new Float32Array(n*3);for(let i=0;i<n;i++){const r=40+Math.random()*40,a=Math.random()*6.283,b=Math.acos(2*Math.random()-1);p.set([r*Math.sin(b)*Math.cos(a),r*Math.cos(b),r*Math.sin(b)*Math.sin(a)],i*3)}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:.25,color:0xbfd8ff,transparent:true,opacity:.7})))}

const G=.035;
function geo(r,c){return new THREE.SphereGeometry(RAD,14,8,c*tp+tp*G,tp*(1-2*G),CAP+r*tl+tl*G,tl*(1-2*G))}
const hue=n=>{const[a,b]=TH[th].h;return a+(b-a)*((n-1)/Math.max(1,N-2))};
function makeTex(n,ok){
  const w=256,h=Math.max(64,Math.min(256,Math.round(256*tl/tp)));
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),hh=hue(n);
  const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,`hsl(${hh},85%,${ok?68:56}%)`);g.addColorStop(1,`hsl(${hh+12},80%,${ok?44:30}%)`);
  x.fillStyle=g;x.fillRect(0,0,w,h);
  x.lineWidth=ok?12:5;x.strokeStyle=ok?'#fff':'rgba(255,255,255,.35)';x.strokeRect(5,5,w-10,h-10);
  x.font=`900 ${h*.58}px Inter,system-ui,sans-serif`;x.textAlign='center';x.textBaseline='middle';
  x.shadowColor='rgba(0,0,0,.55)';x.shadowBlur=8;x.fillStyle='#fff';x.fillText(n,w/2,h/2+h*.03);
  const T=new THREE.CanvasTexture(c);T.anisotropy=4;return T}
function setTex(t){const m=t.mesh.material;if(m.map)m.map.dispose();const T=makeTex(t.n,t.ok);m.map=T;m.emissiveMap=T;m.needsUpdate=true}
const goalOk=t=>t.n===t.idx+1;

function clearTiles(){tiles.forEach(t=>{t.mesh.geometry.dispose();if(t.mesh.material.map)t.mesh.material.map.dispose();t.mesh.material.dispose();tileGroup.remove(t.mesh)});tiles=[]}
function build(){
  L=LV[lv];R=L.r;C=L.c;N=R*C;tp=Math.PI*2/C;tl=(Math.PI-2*CAP)/R;
  clearTiles();
  for(let n=1;n<N;n++){
    const mat=new THREE.MeshStandardMaterial({roughness:.28,metalness:.2,emissive:0xffffff,emissiveIntensity:0,side:THREE.DoubleSide});
    const mesh=new THREE.Mesh(new THREE.BufferGeometry(),mat);const t={n,idx:0,r:0,c:0,a:null,ok:false,mesh,ph:Math.random()*6.28};
    mesh.userData.t=t;tileGroup.add(mesh);tiles.push(t);
  }
  fitCamera();
}
function place(t,idx){t.idx=idx;t.r=(idx/C)|0;t.c=idx%C;t.a=null;t.ok=goalOk(t);t.mesh.geometry.dispose();t.mesh.geometry=geo(t.r,t.c);setTex(t)}
function setEmpty(idx){emptyM.geometry.dispose();emptyM.geometry=geo((idx/C)|0,idx%C)}
function applyTheme(){
  const col=new THREE.Color(`hsl(${TH[th].h[0]},85%,60%)`);
  capMat.emissive.copy(col);emptyMat.color.copy(col);l2.color.copy(new THREE.Color(`hsl(${TH[th].h[1]},80%,60%)`));
  document.documentElement.style.setProperty('--ac',`hsl(${TH[th].h[0]},85%,62%)`);
  tiles.forEach(setTex);store.t=th;save();
}
function fitCamera(){
  const asp=innerWidth/innerHeight,d=asp<1?Math.min(14,7.3/asp*.78):7.3;
  controls.minDistance=d*.7;controls.maxDistance=d*1.6;
  const dir=camera.position.length()>0?camera.position.clone().normalize():new THREE.Vector3(0,.1,1);
  camera.position.copy(dir.multiplyScalar(d));
}
function resetCam(){const asp=innerWidth/innerHeight,d=asp<1?Math.min(14,7.3/asp*.78):7.3;camera.position.set(0,.8,d);controls.target.set(0,0,0);controls.update()}


const nb=e=>{const r=(e/C)|0,c=e%C,v=[];if(r>0)v.push(e-C);if(r<R-1)v.push(e+C);v.push(r*C+(c+C-1)%C,r*C+(c+1)%C);return v};
const emptyIdx=()=>grid.indexOf(null);
let solving=false,solTok=0;
function stopAuto(){solTok++;solving=false;if(autoTimer){clearInterval(autoTimer);autoTimer=null}}
function shuffle(){
  stopAuto();locked=false;started=false;assisted=false;moves=0;secs=0;hist=[];hintTile=null;
  let a,tries=0;
  do{a=Array.from({length:N},(_,i)=>i===N-1?0:i+1);let e=N-1,last=-1;path=[N-1];
    for(let k=0;k<L.s+tries;k++){const v=nb(e).filter(x=>x!==last);const x=v[Math.random()*v.length|0];a[e]=a[x];a[x]=0;last=e;e=x;path.push(x)}
    tries++}while(a.every((v,i)=>v===(i===N-1?0:i+1)));
  grid=new Array(N).fill(null);
  a.forEach((v,i)=>{if(v){const t=tiles[v-1];grid[i]=t;place(t,i)}else setEmpty(i)});
  introT=performance.now();updHUD();sfx.shuf();
}
function updHUD(){
  $('mv').textContent=moves;$('tm').textContent=String(secs/60|0).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');
  $('lvname').textContent='Nivo '+(lv+1)+' · '+R+'×'+C;
  const b=store.b[lv];$('bs').textContent=b?b.m+' pot.':'--';
  $('pb').style.width=(tiles.filter(t=>t.ok).length/(N-1)*100)+'%';
}
function doMove(idx,undo){
  const e=emptyIdx(),t=grid[idx];if(!t)return;
  const er=(e/C)|0,ec=e%C;let dc=ec-t.c;if(Math.abs(dc)>1)dc=dc>0?-1:1;
  t.a={fr:t.r,fc:t.c,dc,tr:er,tc:ec,t0:performance.now()};
  grid[e]=t;grid[idx]=null;t.idx=e;setEmpty(idx);
  if(path.length>1&&path[path.length-2]===idx)path.pop();else path.push(idx);
  const was=t.ok;t.ok=goalOk(t);if(t.ok!==was)setTex(t);
  if(undo)moves=Math.max(0,moves-1);else moves++;
  hintTile=null;updHUD();
  if(t.ok&&!was){sfx.good();buzz(18);pop(t)}else{sfx.move();buzz(8)}
  if(tiles.every(x=>x.ok))win();
}
function tryMove(idx){
  if(locked||autoTimer||solving)return;
  const e=emptyIdx();if(!nb(e).includes(idx))return;
  if(!started){started=true}
  hist.push([idx,e]);doMove(idx,false);
}
function undo(){if(locked||autoTimer||solving||!hist.length)return;const[i,e]=hist.pop();doMove(e,true);sfx.ui()}
function hint(){
  if(locked||autoTimer||solving)return;
  solving=true;const tok=++solTok;
  const start=grid.map(t=>t?t.n:0);
  setTimeout(()=>computeSolution(start,sol=>{
    if(tok!==solTok)return;
    solving=false;if(!sol||!sol.length)return;
    hintTile=grid[sol[0]];hintUntil=performance.now()+3500;sfx.hint();
  },tok),0);
}

function solverTables(){
  const nbs=[],dist=new Uint8Array(N*N);
  for(let e=0;e<N;e++)nbs.push([...new Set(nb(e))]);
  for(let t=1;t<N;t++){const gr=((t-1)/C)|0,gc=(t-1)%C;
    for(let p=0;p<N;p++){const r=(p/C)|0,c=p%C,dc=Math.abs(c-gc);dist[t*N+p]=Math.abs(r-gr)+Math.min(dc,C-dc)}}
  return{nbs,dist};
}

function checkSol(start,sol,nbs){
  const a=start.slice();let e=a.indexOf(0);
  for(const x of sol){if(!nbs[e].includes(x))return false;a[e]=a[x];a[x]=0;e=x}
  for(let i=0;i<N-1;i++)if(a[i]!==i+1)return false;
  return a[N-1]===0;
}

function historySol(start,nbs){
  const a=Array.from({length:N},(_,i)=>i===N-1?0:i+1);
  const key=()=>String.fromCharCode.apply(null,a);
  let e=N-1;const st=[N-1],ks=[key()],seen=new Map([[ks[0],0]]);
  for(let i=1;i<path.length;i++){
    const x=path[i];
    if(!nbs[e].includes(x))return null;
    a[e]=a[x];a[x]=0;e=x;
    const k=key(),j=seen.get(k);
    if(j!==undefined){while(st.length>j+1){st.pop();seen.delete(ks.pop())}}
    else{st.push(x);ks.push(k);seen.set(k,st.length-1)}
  }
  const sol=[];for(let i=st.length-2;i>=0;i--)sol.push(st[i]);
  return checkSol(start,sol,nbs)?sol:null;
}

function runStage(start,T,w,cap,bound,tok,done){
  const{nbs,dist}=T,mapId=new Map(),S=[],G=[],Pr=[],Mv=[],H=[],hk=[],hi=[],hg=[];
  let pid=0;
  function hpush(k,id,g){let i=hk.length;hk.push(k);hi.push(id);hg.push(g);
    while(i>0){const p=(i-1)>>1;if(hk[p]<=k)break;hk[i]=hk[p];hi[i]=hi[p];hg[i]=hg[p];i=p}
    hk[i]=k;hi[i]=id;hg[i]=g}
  function hpop(){const id0=hi[0],g0=hg[0],lk=hk.pop(),li=hi.pop(),lg=hg.pop(),n=hk.length;
    if(n>0){let i=0;for(;;){let c=2*i+1;if(c>=n)break;if(c+1<n&&hk[c+1]<hk[c])c++;if(hk[c]>=lk)break;hk[i]=hk[c];hi[i]=hi[c];hg[i]=hg[c];i=c}hk[i]=lk;hi[i]=li;hg[i]=lg}
    pid=id0;return g0}
  let h0=0;for(let p=0;p<N;p++)if(start[p])h0+=dist[start[p]*N+p];
  if(h0>=bound)return done(false);
  S.push(String.fromCharCode.apply(null,start));G.push(0);Pr.push(-1);Mv.push(-1);H.push(h0);mapId.set(S[0],0);hpush(w*h0*1024,0,0);
  const a=new Array(N);
  function step(){
    if(tok!==solTok)return;
    const t0=performance.now();let cnt=0;
    while(hk.length){
      if((++cnt&127)===0&&performance.now()-t0>12){setTimeout(step,0);return}
      const pg=hpop(),id=pid;if(pg!==G[id])continue;
      if(H[id]===0){const sol=[];for(let n=id;Pr[n]>=0;n=Pr[n])sol.push(Mv[n]);return done(sol.reverse())}
      if(S.length>cap)return done(null);
      const s=S[id];for(let i=0;i<N;i++)a[i]=s.charCodeAt(i);
      const e=a.indexOf(0),g=G[id]+1;
      for(const x of nbs[e]){
        const t=a[x],h=H[id]-dist[t*N+x]+dist[t*N+e];
        if(g+h>=bound)continue;
        a[e]=t;a[x]=0;const k=String.fromCharCode.apply(null,a);a[x]=t;a[e]=0;
        const old=mapId.get(k);
        if(old===undefined){const nid=S.length;S.push(k);G.push(g);Pr.push(id);Mv.push(x);H.push(h);mapId.set(k,nid);hpush((g+w*h)*1024-g,nid,g)}
        else if(g<G[old]){G[old]=g;Pr[old]=id;Mv[old]=x;hpush((g+w*H[old])*1024-g,old,g)}
      }
    }
    done(false);
  }
  step();
}
function computeSolution(start,cb,tok){
  const T=solverTables(),hs=historySol(start,T.nbs);
  const stages=[[1,100000],[2,100000],[4,150000],[10,200000]];let i=0;
  const next=()=>{
    if(tok!==solTok)return;
    if(i>=stages.length)return cb(hs);
    const[w,cap]=stages[i++];
    runStage(start,T,w,cap,hs?hs.length:1e9,tok,r=>{
      if(tok!==solTok)return;
      if(r===false)return cb(hs);
      if(r&&checkSol(start,r,T.nbs))return cb(r);
      next();
    });
  };
  next();
}
function solve(){
  if(locked||autoTimer||solving)return;
  assisted=true;sfx.ui();solving=true;const tok=++solTok;toast('🧠 Računam…');
  const start=grid.map(t=>t?t.n:0);
  setTimeout(()=>computeSolution(start,sol=>{
    if(tok!==solTok)return;
    solving=false;if(!sol||!sol.length)return;
    const q=sol.slice();
    autoTimer=setInterval(()=>{if(q.length&&!locked)doMove(q.shift(),false);else stopAuto()},170);
  },tok),30);
}
function toast(s){const t=$('toast');t.textContent=s;t.classList.remove('on');void t.offsetWidth;t.classList.add('on')}
function win(){
  locked=true;stopAuto();sfx.win();buzz([40,40,80]);burst();
  const r=moves/L.s,stars=assisted?0:r<=.6?3:r<=1.2?2:1;
  let rec=false;
  if(!assisted){const b=store.b[lv];if(!b||moves<b.m){store.b[lv]={m:moves,t:secs};rec=true}
    store.s[lv]=Math.max(store.s[lv]||0,stars);store.u=Math.max(store.u,Math.min(lv+2,LV.length))}
  save();updHUD();
  setTimeout(()=>{
    $('wst').textContent=assisted?'🪄':'⭐'.repeat(stars)+'☆'.repeat(3-stars);
    $('wt').textContent=assisted?'Rešeno!':rec?'Novi rekord! 🏆':'BRAVO!';
    $('wm').textContent=assisted?'Sfera je rešena uz pomoć. Probaj sam za zvezdice!':`Rešeno za ${moves} poteza i ${$('tm').textContent}.`;
    $('wNext').style.display=lv<LV.length-1?'':'none';
    $('win').classList.add('on');
  },1300);
}

let P=null;
function burst(){
  const n=300,pos=new Float32Array(n*3),vel=[];
  for(let i=0;i<n;i++){const a=Math.random()*6.283,b=Math.acos(2*Math.random()-1),s=1.5+Math.random()*3;vel.push(Math.sin(b)*Math.cos(a)*s,Math.cos(b)*s,Math.sin(b)*Math.sin(a)*s)}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  P=new THREE.Points(g,new THREE.PointsMaterial({size:.09,color:new THREE.Color(`hsl(${hue(N/2)},90%,65%)`),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  P.userData={vel,t0:performance.now()};scene.add(P);
}
function pop(t){t.pop=performance.now()}

const ray=new THREE.Raycaster(),mv=new THREE.Vector2();let dn=null;
cvEl.addEventListener('pointerdown',e=>{dn={x:e.clientX,y:e.clientY,t:performance.now()}});
cvEl.addEventListener('pointerup',e=>{
  if(!dn)return;const d=Math.hypot(e.clientX-dn.x,e.clientY-dn.y),dt=performance.now()-dn.t;dn=null;
  if(d>8||dt>500)return;
  const r=cvEl.getBoundingClientRect();mv.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(mv,camera);const h=ray.intersectObjects(tileGroup.children)[0];
  if(h)tryMove(h.object.userData.t.idx);
});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='u'||k==='z')undo();else if(k==='h')hint();else if(k==='r')shuffle();else if(k==='m')openMenu()});
$('bUndo').onclick=undo;$('bHint').onclick=hint;$('bShuf').onclick=()=>{shuffle()};$('bSolve').onclick=solve;$('bCam').onclick=()=>{sfx.ui();resetCam()};
$('thbtn').onclick=()=>{th=(th+1)%TH.length;applyTheme();sfx.ui();toast(TH[th].n)};
$('sdbtn').onclick=()=>{snd=!snd;$('sdi').textContent=snd?'🔊':'🔇';if(snd)sfx.ui()};
function openMenu(){
  sfx.ui();const box=$('lvs');box.innerHTML='';
  LV.forEach((l,i)=>{const d=document.createElement('button');const lk=i>=store.u;d.className='lv'+(i===lv?' cur':'')+(lk?' lock':'');
    const s=store.s[i]||0;d.innerHTML=`<b>${lk?'🔒':''} Nivo ${i+1}</b><small>${l.r}×${l.c} · ${l.r*l.c-1} pločica</small><span class="st">${'★'.repeat(s)+'☆'.repeat(3-s)}</span>`;
    d.onclick=()=>{if(lk)return;$('menu').classList.remove('on');goLevel(i)};box.appendChild(d)});
  $('menu').classList.add('on');
}
$('lvbtn').onclick=openMenu;$('mclose').onclick=()=>{sfx.ui();$('menu').classList.remove('on')};
$('wAgain').onclick=()=>{$('win').classList.remove('on');shuffle()};
$('wNext').onclick=()=>{$('win').classList.remove('on');goLevel(lv+1)};
function goLevel(i){stopAuto();lv=i;store.l=i;save();build();applyTheme();shuffle();toast('Nivo '+(i+1))}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);fitCamera()});
setInterval(()=>{if(started&&!locked){secs++;updHUD()}},1000);


const ease=p=>1-Math.pow(1-p,3);
function frame(now){
  requestAnimationFrame(frame);
  const tm=now/1000,e=emptyIdx(),movable=e>=0?nb(e):[];
  for(const t of tiles){
    if(t.a){const p=Math.min(1,(now-t.a.t0)/200),k=ease(p);
      t.r=t.a.fr+(t.a.tr-t.a.fr)*k;t.c=t.a.fc+t.a.dc*k;
      t.mesh.geometry.dispose();t.mesh.geometry=geo(t.r,t.c);
      if(p>=1){t.r=t.a.tr;t.c=t.a.tc;t.a=null;t.mesh.geometry.dispose();t.mesh.geometry=geo(t.r,t.c)}}
    let em=0;
    if(!locked&&movable.includes(t.idx))em=.05+.05*Math.sin(tm*4+t.ph);
    if(t===hintTile&&now<hintUntil)em=.35+.3*Math.sin(tm*9);
    if(locked&&t.ok)em=.25+.2*Math.sin(tm*5+t.n*.5);
    t.mesh.material.emissiveIntensity=em;
    const pp=t.pop?(now-t.pop)/350:1;
    const sc=pp<1?1+.08*Math.sin(pp*Math.PI):1;t.mesh.scale.setScalar(sc);
  }
  emptyMat.opacity=.1+.08*Math.sin(tm*3);
  const k=Math.min(1,(now-introT)/800),eb=1+2.7*Math.pow(k-1,3)+1.7*Math.pow(k-1,2);
  sg.scale.setScalar(.6+.4*eb);sg.rotation.y=(1-k)*2.5;
  if(P){const age=(now-P.userData.t0)/1000,pa=P.geometry.attributes.position,v=P.userData.vel;
    for(let i=0;i<pa.count;i++)pa.setXYZ(i,v[i*3]*age,v[i*3+1]*age-age*age*.6,v[i*3+2]*age);
    pa.needsUpdate=true;P.material.opacity=Math.max(0,1-age/2);
    if(age>2){scene.remove(P);P.geometry.dispose();P.material.dispose();P=null}}
  controls.update();renderer.render(scene,camera);
}
build();applyTheme();resetCam();shuffle();requestAnimationFrame(frame);
</script>
